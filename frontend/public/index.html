<!DOCTYPE html>
<html lang="es" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPN FIS Chat WebSocket</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./style.css" />
</head>

<body class="bg-body-tertiary transition-colors">
    <div class="container py-4">

        <!-- Toggle Modo Claro / Oscuro -->
        <div class="d-flex justify-content-end mb-4">
            <button id="themeToggle" class="btn btn-outline-secondary shadow-sm">Modo Oscuro</button>
        </div>

        <!-- Pantalla de Ingreso -->
        <div id="loginScreen" class="card mx-auto shadow-lg border-0" style="max-width: 400px; margin-top: 10vh;">
            <div class="card-body p-5 text-center">
                <h2 class="card-title fw-bold text-primary mb-4">EPN FIS Chat</h2>
                <div class="mb-4">
                    <label class="form-label text-muted">Ingresa tu nombre para continuar</label>
                    <input type="text" id="usernameInput" class="form-control form-control-lg text-center"
                        placeholder="Ej: Estudiante" maxlength="20">
                </div>
                <button id="enterChatBtn" class="btn btn-primary btn-lg w-100 shadow-sm">Entrar al Chat</button>
            </div>
        </div>

        <!-- Pantalla de Chat (Oculta al inicio) -->
        <div id="chatScreen" class="card mx-auto shadow-lg border-0 d-none" style="max-width: 800px;">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-3">
                <h5 class="mb-0 fw-bold">Sala de Chat General</h5>
                <span id="status" class="badge bg-secondary">Desconectado</span>
            </div>

            <div class="card-body p-0">
                <!-- Área donde se acumulan los mensajes -->
                <div id="messages" class="p-4 custom-bg-chat"></div>
            </div>

            <div class="card-footer bg-body p-3 border-top-0">
                <div class="input-group">
                    <input type="text" id="messageInput" class="form-control form-control-lg"
                        placeholder="Escribe tu mensaje..." maxlength="500">
                    <button id="sendBtn" class="btn btn-success px-4 fw-bold">Enviar</button>
                </div>
            </div>
        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./script.js"></script>
</body>

</html>
