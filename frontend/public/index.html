<!DOCTYPE html>
<html lang="es" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPN FIS Chat WebSocket</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./style.css" />
</head>

<body class="bg-body-tertiary transition-colors">
    <div class="container py-4">

        <!-- Toggle Modo Claro / Oscuro -->
        <div class="d-flex justify-content-end mb-4">
            <button id="themeToggle" class="btn btn-outline-secondary shadow-sm">Modo Oscuro</button>
        </div>

        <!-- Pantalla de Ingreso -->
        <div id="loginScreen">
            <h1 class="text-center">Chat Comunitario</h1>
            <div class="auth-container">
                <input type="email" id="emailInput" placeholder="Correo electrónico" required>
                <input type="password" id="passwordInput" placeholder="Contraseña" required>

                <div class="button-group">
                    <button id="loginBtn">Iniciar Sesión</button>
                    <button id="registerBtn" class="secondary-btn">Registrarse</button>
                </div>
            </div>
        </div>

        <!-- Pantalla de Chat (Oculta al inicio) -->
        <div id="chatScreen" class="card mx-auto shadow-lg border-0 d-none" style="max-width: 800px;">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-3">
                <h5 class="mb-0 fw-bold">Sala de Chat General</h5>
                <span id="status" class="badge bg-secondary">Desconectado</span>
            </div>

            <div class="card-body p-0">
                <!-- Área donde se acumulan los mensajes -->
                <div id="messages" class="p-4 custom-bg-chat"></div>
            </div>

            <div class="card-footer bg-body p-3 border-top-0">
                <div class="input-group">
                    <input type="text" id="messageInput" class="form-control form-control-lg"
                        placeholder="Escribe tu mensaje..." maxlength="500">
                    <button id="sendBtn" class="btn btn-success px-4 fw-bold">Enviar</button>
                </div>
            </div>
        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Firebase JS SDKs (Compatibilidad para versiones anteriores) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDfu0rC89nxkdN1D4HIxc15ItdxOexfhqE",
            authDomain: "labwebav-websocketchat-fbeca.firebaseapp.com",
            projectId: "labwebav-websocketchat-fbeca",
            storageBucket: "labwebav-websocketchat-fbeca.firebasestorage.app",
            messagingSenderId: "90365814207",
            appId: "1:90365814207:web:4d69bc215212c1b4272d0a",
            measurementId: "G-BRM23PE75T"
        };
        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
    </script>
    <script src="./script.js"></script>
</body>

</html>
